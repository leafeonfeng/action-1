name: Pack Proxy-GS Conda Environment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment.yml and requirements.txt
        shell: bash
        run: |
          cat > environment.yml <<'EOF'
          name: Proxy-GS
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=3.11
            - pip=24.0
            - git
            - ninja
          EOF

          cat > requirements.txt <<'EOF'
          # PyTorch / torchvision / torch-scatter are installed separately.
          # They must use CUDA 12.6 compatible wheels.

          colorama==0.4.6
          einops==0.8.1
          jaxtyping==0.3.3
          lpips==0.1.4
          numpy==2.3.3
          nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git@abb07ca0358f3a21c3942b50c54aa1eacd329af9
          open3d==0.19.0
          opencv-python-headless==4.10.0.84
          OpenEXR==3.4.4
          Pillow==11.3.0
          plyfile==1.1.3
          scipy==1.16.3
          tqdm==4.67.1
          trimesh==4.9.0
          wandb==0.23.0
          EOF

          echo "===== environment.yml ====="
          cat environment.yml

          echo "===== requirements.txt ====="
          cat requirements.txt

      - name: Setup Miniconda and create Proxy-GS environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: false
          activate-environment: Proxy-GS
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install CUDA 12.6 PyTorch and PyG packages
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          PYTORCH_INDEX_URL="https://download.pytorch.org/whl/cu126"
          PYG_WHEEL_URL="https://data.pyg.org/whl/torch-2.6.0+cu126.html"

          echo "===== Python / pip information ====="
          conda run -n Proxy-GS python -V
          conda run -n Proxy-GS python -m pip --version

          echo "===== Upgrade pip build tools ====="
          conda run -n Proxy-GS python -m pip install --upgrade pip setuptools wheel

          echo "===== Install PyTorch CUDA 12.6 ====="
          conda run -n Proxy-GS python -m pip install \
            torch==2.6.0 \
            torchvision==0.21.0 \
            --index-url "$PYTORCH_INDEX_URL"

          echo "===== Check PyTorch CUDA version ====="
          conda run -n Proxy-GS python - <<'PY'
          import torch

          print("torch version:", torch.__version__)
          print("torch CUDA version:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())
          print("CUDA device count:", torch.cuda.device_count())

          assert torch.version.cuda == "12.6", (
              f"Expected CUDA 12.6 PyTorch wheel, got {torch.version.cuda}"
          )
          PY

          echo "===== Install PyG CUDA 12.6 binary packages ====="
          conda run -n Proxy-GS python -m pip install \
            pyg_lib \
            torch_sparse \
            torch_cluster \
            torch_spline_conv \
            -f "$PYG_WHEEL_URL"

          echo "===== Install torch-scatter last ====="
          conda run -n Proxy-GS python -m pip install \
            torch-scatter \
            -f "$PYG_WHEEL_URL"

          echo "===== Show installed torch-related packages ====="
          conda run -n Proxy-GS python -m pip list | grep -E \
            'torch|pyg|scatter|sparse|cluster|spline' || true

      - name: Install remaining pip requirements
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "===== Install requirements.txt ====="
          conda run -n Proxy-GS python -m pip install \
            --prefer-binary \
            -r requirements.txt

          echo "===== Disk usage after requirements install ====="
          df -h

      - name: Check Proxy-GS environment
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "===== Python ====="
          conda run -n Proxy-GS python -V

          echo "===== PyTorch / CUDA ====="
          conda run -n Proxy-GS python - <<'PY'
          import torch
          import torchvision

          print("torch:", torch.__version__)
          print("torch CUDA:", torch.version.cuda)
          print("torchvision:", torchvision.__version__)
          print("CUDA available:", torch.cuda.is_available())

          assert torch.version.cuda == "12.6"
          PY

          echo "===== PyG CUDA extensions ====="
          conda run -n Proxy-GS python - <<'PY'
          import torch_scatter
          import torch_sparse
          import torch_cluster
          import torch_spline_conv

          try:
              import pyg_lib
              print("pyg_lib: OK")
          except ImportError:
              print("pyg_lib: not installed or unavailable")

          print("torch_scatter: OK")
          print("torch_sparse: OK")
          print("torch_cluster: OK")
          print("torch_spline_conv: OK")
          PY

          echo "===== Other important packages ====="
          conda run -n Proxy-GS python - <<'PY'
          import colorama
          import einops
          import jaxtyping
          import lpips
          import numpy
          import open3d as o3d
          import cv2
          import OpenEXR
          import PIL
          import plyfile
          import scipy
          import tqdm
          import trimesh
          import wandb

          print("numpy:", numpy.__version__)
          print("scipy:", scipy.__version__)
          print("open3d:", o3d.__version__)
          print("cv2:", cv2.__version__)
          print("Pillow:", PIL.__version__)
          print("trimesh:", trimesh.__version__)
          print("wandb:", wandb.__version__)
          print("All normal packages imported successfully.")
          PY

          echo "===== nvdiffrast ====="
          conda run -n Proxy-GS python - <<'PY'
          import nvdiffrast
          print("nvdiffrast imported successfully")
          PY

      - name: Show conda information
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          conda info
          conda env list

          echo "===== Environment size ====="
          du -sh "$CONDA/envs/Proxy-GS"

          echo "===== Disk usage ====="
          df -h

      - name: Install conda-pack into base environment
        shell: bash
        run: |
          set -euxo pipefail

          "$CONDA/bin/python" -m pip install --upgrade pip
          "$CONDA/bin/python" -m pip install "conda-pack==0.9.1"

          "$CONDA/bin/conda-pack" --version

      - name: Clean caches before packing
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "===== Disk before cleanup ====="
          df -h

          conda clean -a -y

          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.nv || true

          echo "===== Environment size after cleanup ====="
          du -sh "$CONDA/envs/Proxy-GS"

          echo "===== Disk after cleanup ====="
          df -h

      - name: Pack and split Proxy-GS environment
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE_NAME="Proxy-GS.tar.gz"
          RELEASE_DIR="release_parts"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          rm -f "$ARCHIVE_NAME"

          echo "===== Confirm environment Python version ====="
          "$CONDA/bin/conda" run -n Proxy-GS python -V

          echo "===== Pack Conda environment ====="
          "$CONDA/bin/conda-pack" \
            -n Proxy-GS \
            -o "$ARCHIVE_NAME" \
            --format tar.gz \
            --ignore-missing-files \
            --force

          echo "===== Archive size ====="
          ls -lh "$ARCHIVE_NAME"

          echo "===== Delete original Conda environment to free disk ====="
          rm -rf "$CONDA/envs/Proxy-GS" || true
          rm -rf "$CONDA/pkgs" || true

          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.nv || true
          rm -rf /tmp/* || true

          echo "===== Disk before splitting ====="
          df -h

          # GitHub Release 的单个附件上限小于 2GB。
          # 每个分片固定为 1000MB。
          split \
            -b 1000M \
            -d \
            -a 3 \
            "$ARCHIVE_NAME" \
            "$RELEASE_DIR/Proxy-GS.tar.gz.part-"

          rm -f "$ARCHIVE_NAME"

          cp environment.yml "$RELEASE_DIR/environment.yml"
          cp requirements.txt "$RELEASE_DIR/requirements.txt"

          echo "===== Release files ====="
          ls -lh "$RELEASE_DIR"

          echo "===== Disk after splitting ====="
          df -h

      - name: Create GitHub Release and upload parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proxy-gs-conda-${{ github.run_number }}
          name: Proxy-GS Conda Environment ${{ github.run_number }}
          body: |
            Prebuilt Proxy-GS Linux x64 Conda environment.

            ## Environment

            ```text
            Name: Proxy-GS
            Python: 3.11
            ```

            ## CUDA / PyTorch

            ```text
            torch==2.6.0
            torchvision==0.21.0
            CUDA wheel: cu126
            ```

            PyG CUDA extension wheels were installed from:

            ```text
            https://data.pyg.org/whl/torch-2.6.0+cu126.html
            ```

            Installed PyG packages:

            ```text
            pyg_lib
            torch_sparse
            torch_cluster
            torch_spline_conv
            torch-scatter
            ```

            ## Restore environment

            Download every file below into the same directory:

            ```text
            Proxy-GS.tar.gz.part-000
            Proxy-GS.tar.gz.part-001
            Proxy-GS.tar.gz.part-002
            ...
            ```

            Merge the parts:

            ```bash
            cat Proxy-GS.tar.gz.part-* > Proxy-GS.tar.gz
            ```

            Extract the environment:

            ```bash
            mkdir -p Proxy-GS
            tar -xzf Proxy-GS.tar.gz -C Proxy-GS
            ```

            Activate it:

            ```bash
            source Proxy-GS/bin/activate
            ```

            Run this once after extraction:

            ```bash
            conda-unpack
            ```

            Verify CUDA package versions:

            ```bash
            python -c "import torch; print(torch.__version__, torch.version.cuda)"
            python -c "import torchvision; print(torchvision.__version__)"
            python -c "import torch_scatter; print('torch-scatter OK')"
            python -c "import torch_sparse; print('torch_sparse OK')"
            python -c "import torch_cluster; print('torch_cluster OK')"
            python -c "import torch_spline_conv; print('torch_spline_conv OK')"
            ```

            `environment.yml` and `requirements.txt` are included for reference.
          files: |
            release_parts/Proxy-GS.tar.gz.part-*
            release_parts/environment.yml
            release_parts/requirements.txt
          fail_on_unmatched_files: true
