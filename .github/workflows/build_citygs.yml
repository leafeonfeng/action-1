name: Build CityGaussian Environment Ubuntu2404 CUDA124 PyTorch251

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-env:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.9"
          activate-environment: base

      - name: Show system information
        run: |
          uname -a
          lsb_release -a || true
          df -h
          free -h
          conda --version
          python --version
          gcc --version
          g++ --version

      - name: Clone CityGaussian repository
        run: |
          git clone https://github.com/DekuLiuTesla/CityGaussian.git
          cd CityGaussian
          git rev-parse HEAD

      - name: Create conda environment
        run: |
          conda create -y -n gspl python=3.9 pip
          conda run -n gspl python --version
          conda run -n gspl python -m pip --version

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            ffmpeg \
            libgl1 \
            libglib2.0-0

      - name: Install pip build tools
        run: |
          conda run -n gspl python -m pip install --upgrade pip setuptools wheel ninja packaging cmake

      - name: Install PyTorch 2.5.1 CUDA 12.4
        run: |
          conda run -n gspl python -m pip install \
            torch==2.5.1 \
            torchvision==0.20.1 \
            torchaudio==2.5.1 \
            --index-url https://download.pytorch.org/whl/cu124

      - name: Verify PyTorch
        run: |
          conda run -n gspl python - <<'EOF'
          import torch
          print("Torch:", torch.__version__)
          print("Torch CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())
          print("Torch path:", torch.__file__)
          EOF

      - name: Install CUDA Toolkit 12.4 into conda env
        run: |
          conda install -y -n gspl -c nvidia/label/cuda-12.4.0 cuda-toolkit

      - name: Configure CUDA environment variables
        run: |
          CONDA_ENV_PATH="$(conda info --base)/envs/gspl"

          echo "CUDA_HOME=$CONDA_ENV_PATH" >> "$GITHUB_ENV"
          echo "CUDA_PATH=$CONDA_ENV_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_ENV_PATH/lib:$CONDA_ENV_PATH/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          echo "TORCH_CUDA_ARCH_LIST=7.5;8.0;8.6;8.9;9.0" >> "$GITHUB_ENV"
          echo "FORCE_CUDA=1" >> "$GITHUB_ENV"

          echo "$CONDA_ENV_PATH/bin" >> "$GITHUB_PATH"

      - name: Check CUDA compiler
        run: |
          echo "CUDA_HOME=$CUDA_HOME"
          echo "CUDA_PATH=$CUDA_PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          echo "TORCH_CUDA_ARCH_LIST=$TORCH_CUDA_ARCH_LIST"

          which nvcc
          nvcc --version

          conda run -n gspl python - <<'EOF'
          import os
          print("CUDA_HOME env:", os.environ.get("CUDA_HOME"))
          print("CUDA_PATH env:", os.environ.get("CUDA_PATH"))

          import torch
          print("Torch:", torch.__version__)
          print("Torch CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          from torch.utils.cpp_extension import CUDA_HOME
          print("torch cpp_extension CUDA_HOME:", CUDA_HOME)
          EOF

      - name: Show requirements
        run: |
          cd CityGaussian
          echo "===== requirements.txt ====="
          cat requirements.txt || true
          echo ""
          echo "===== requirements/CityGS.txt ====="
          cat requirements/CityGS.txt || true

      - name: Install main requirements without touching torch
        run: |
          cd CityGaussian

          rm -rf /tmp/citygaussian-req
          mkdir -p /tmp/citygaussian-req

          cp requirements.txt /tmp/citygaussian-req/requirements.txt
          cp -a requirements /tmp/citygaussian-req/requirements

          find /tmp/citygaussian-req -type f -name "*.txt" -print0 | while IFS= read -r -d '' f; do
            sed -i -E '/^[[:space:]]*(torch|torchvision|torchaudio)([=<>!~ ;]|$)/Id' "$f"
          done

          echo "===== filtered /tmp/citygaussian-req/requirements.txt ====="
          cat /tmp/citygaussian-req/requirements.txt

          echo "===== filtered nested requirements ====="
          find /tmp/citygaussian-req -type f -name "*.txt" -maxdepth 3 -print

          conda run -n gspl bash -lc '
            echo "CUDA_HOME=$CUDA_HOME"
            echo "CUDA_PATH=$CUDA_PATH"
            echo "TORCH_CUDA_ARCH_LIST=$TORCH_CUDA_ARCH_LIST"
            which nvcc
            nvcc --version
            python -m pip install --no-build-isolation -r /tmp/citygaussian-req/requirements.txt
          '

      - name: Verify PyTorch after main requirements
        run: |
          conda run -n gspl python - <<'EOF'
          import torch
          print("Torch:", torch.__version__)
          print("Torch CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())
          EOF

      - name: Install CityGaussian additional requirements without touching torch
        run: |
          cd CityGaussian

          grep -viE '^[[:space:]]*(torch|torchvision|torchaudio)([=<>!~ ;]|$)' requirements/CityGS.txt > /tmp/CityGS-no-torch.txt

          echo "===== filtered requirements/CityGS.txt ====="
          cat /tmp/CityGS-no-torch.txt

          conda run -n gspl bash -lc '
            echo "CUDA_HOME=$CUDA_HOME"
            echo "CUDA_PATH=$CUDA_PATH"
            echo "TORCH_CUDA_ARCH_LIST=$TORCH_CUDA_ARCH_LIST"
            which nvcc
            nvcc --version
            python -m pip install --no-build-isolation -r /tmp/CityGS-no-torch.txt
          '

      - name: Verify final Python environment
        run: |
          conda run -n gspl python - <<'EOF'
          import sys
          print("Python:", sys.version)

          import torch
          print("Torch:", torch.__version__)
          print("Torch CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          import torchvision
          print("Torchvision:", torchvision.__version__)

          import torchaudio
          print("Torchaudio:", torchaudio.__version__)
          EOF

      - name: Install conda-pack
        run: |
          conda install -y -n base conda-pack

      - name: Pack conda environment
        run: |
          conda pack -n gspl -o citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz --ignore-missing-files
          ls -lh citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz

      - name: Save CityGaussian source code
        run: |
          tar --exclude='.git' -czf CityGaussian-source.tar.gz CityGaussian
          ls -lh CityGaussian-source.tar.gz

      - name: Split environment package into 10 parts
        run: |
          split -n 10 -d -a 2 citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.part-
          ls -lh citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.part-*

      - name: Generate SHA256 checksums
        run: |
          sha256sum citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz > citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.sha256
          sha256sum citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.part-* > citygaussian-gspl-ubuntu2404-cu124-torch251.parts.sha256
          sha256sum CityGaussian-source.tar.gz > CityGaussian-source.tar.gz.sha256

      - name: Create release tag
        id: tag
        run: |
          TAG="citygaussian-env-ubuntu2404-cu124-torch251-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          gh release create "$TAG" \
            citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.part-* \
            citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.sha256 \
            citygaussian-gspl-ubuntu2404-cu124-torch251.parts.sha256 \
            CityGaussian-source.tar.gz \
            CityGaussian-source.tar.gz.sha256 \
            --title "CityGaussian Ubuntu24.04 CUDA12.4 PyTorch2.5.1 $TAG" \
            --notes "CityGaussian conda environment built with Ubuntu 24.04, CUDA 12.4, PyTorch 2.5.1.

          Restore:

          \`\`\`bash
          cat citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.part-* > citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz
          sha256sum -c citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.sha256

          mkdir -p gspl
          tar -xzf citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz -C gspl
          source gspl/bin/activate
          conda-unpack

          python -c \"import torch; print(torch.__version__); print(torch.version.cuda)\"
          \`\`\`
          "

      - name: Upload artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: citygaussian-env-ubuntu2404-cu124-torch251-parts
          path: |
            citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.part-*
            citygaussian-gspl-ubuntu2404-cu124-torch251.tar.gz.sha256
            citygaussian-gspl-ubuntu2404-cu124-torch251.parts.sha256
            CityGaussian-source.tar.gz
            CityGaussian-source.tar.gz.sha256

      - name: Print download link
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "## Download Link" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release page:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact backup page:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"


          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact backup page:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
