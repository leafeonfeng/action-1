name: Build CityGaussian Ubuntu2404 Environment

on:
  workflow_dispatch:

jobs:
  build-env:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout CityGaussian repository
        uses: actions/checkout@v4
        with:
          repository: DekuLiuTesla/CityGaussian
          path: CityGaussian

      - name: Setup micromamba with Python 3.9
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          environment-name: gspl
          create-args: >-
            python=3.9
            pip
          init-shell: bash
          cache-environment: false
          post-cleanup: all

      - name: Upgrade pip tools
        shell: bash -el {0}
        run: |
          micromamba activate gspl
          python -m pip install --upgrade pip setuptools wheel

      - name: Install PyTorch CUDA 12.4
        shell: bash -el {0}
        run: |
          micromamba activate gspl

          pip install \
            --index-url https://download.pytorch.org/whl/cu124 \
            torch==2.5.1 \
            torchvision==0.20.* \
            torchaudio==2.5.*

      - name: Install torch_scatter
        shell: bash -el {0}
        run: |
          micromamba activate gspl

          pip install torch_scatter \
            -f https://data.pyg.org/whl/torch-2.5.1+cu124.html

      - name: Install project Python packages
        shell: bash -el {0}
        run: |
          micromamba activate gspl

          cat > /tmp/citygaussian_requirements.txt << 'EOF'
          open3d==0.18.0
          scikit-image==0.24.0
          trimesh==4.4.3
          imageio==2.36.0
          imageio-ffmpeg==0.5.1
          py3nvml
          splines==0.3.0
          plyfile==0.8.1
          tensorboard
          wandb
          tqdm
          einops
          joblib
          viser==0.2.3
          opencv-python-headless==4.10.*
          matplotlib
          mediapy==1.2.2
          lightning[pytorch-extra]==2.3.*
          pytorch-lightning==2.3.*
          bitsandbytes==0.45.*
          EOF

          pip install -r /tmp/citygaussian_requirements.txt

      - name: Show installed environment info
        shell: bash -el {0}
        run: |
          micromamba activate gspl

          echo "Python version:"
          python --version

          echo "Pip version:"
          pip --version

          echo "PyTorch info:"
          python - << 'EOF'
          import torch
          print("torch:", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          print("torch cuda:", torch.version.cuda)
          EOF

          echo "Installed packages:"
          pip list

      - name: Package environment and split into parts
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          ENV_DIR="${MAMBA_ROOT_PREFIX}/envs/gspl"

          echo "Disk before packaging:"
          df -h

          echo "Environment size:"
          du -sh "${ENV_DIR}"

          mkdir -p split_artifacts

          echo "Packing environment by streaming tar.gz to split..."
          echo "This avoids creating one huge tar.gz before splitting."

          tar -C "${ENV_DIR}" -cf - . \
            | gzip -1 \
            | split \
                -b 1900M \
                -d \
                -a 2 \
                - \
                split_artifacts/gspl-ubuntu2404-python39-cu124.tar.gz.part-

          echo "Split files:"
          ls -lh split_artifacts/

          echo "Disk after packaging:"
          df -h

          PART_COUNT=$(ls split_artifacts/gspl-ubuntu2404-python39-cu124.tar.gz.part-* | wc -l)
          echo "Part count: ${PART_COUNT}"

      - name: Upload environment artifact part 00
        uses: actions/upload-artifact@v4
        with:
          name: gspl-ubuntu2404-python39-cu124-part-00
          path: split_artifacts/gspl-ubuntu2404-python39-cu124.tar.gz.part-00
          retention-days: 7

      - name: Upload environment artifact part 01
        uses: actions/upload-artifact@v4
        with:
          name: gspl-ubuntu2404-python39-cu124-part-01
          path: split_artifacts/gspl-ubuntu2404-python39-cu124.tar.gz.part-01
          retention-days: 7

      - name: Upload environment artifact part 02
        uses: actions/upload-artifact@v4
        with:
          name: gspl-ubuntu2404-python39-cu124-part-02
          path: split_artifacts/gspl-ubuntu2404-python39-cu124.tar.gz.part-02
          retention-days: 7

      - name: Add download link to summary
        shell: bash
        run: |
          echo "## CityGaussian Environment Download" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "环境已经构建完成，并拆分为 3 个 GitHub Actions Artifact。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "下载入口：" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "需要下载下面三个 Artifact：" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. \`gspl-ubuntu2404-python39-cu124-part-00\`" >> "$GITHUB_STEP_SUMMARY"
          echo "2. \`gspl-ubuntu2404-python39-cu124-part-01\`" >> "$GITHUB_STEP_SUMMARY"
          echo "3. \`gspl-ubuntu2404-python39-cu124-part-02\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "合并命令：" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "cat gspl-ubuntu2404-python39-cu124.tar.gz.part-00 \\" >> "$GITHUB_STEP_SUMMARY"
          echo "    gspl-ubuntu2404-python39-cu124.tar.gz.part-01 \\" >> "$GITHUB_STEP_SUMMARY"
          echo "    gspl-ubuntu2404-python39-cu124.tar.gz.part-02 \\" >> "$GITHUB_STEP_SUMMARY"
          echo "    > gspl-ubuntu2404-python39-cu124.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "mkdir -p gspl" >> "$GITHUB_STEP_SUMMARY"
          echo "tar -xzf gspl-ubuntu2404-python39-cu124.tar.gz -C ./gspl" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "mkdir -p gspl" >> "$GITHUB_STEP_SUMMARY"
          echo "tar -xzf gspl-ubuntu2404-python39-cu124.tar.gz -C ./gspl" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
