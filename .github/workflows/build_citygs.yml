name: Build CityGaussian Ubuntu2404 Environment

on:
  workflow_dispatch:

jobs:
  build-env:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout CityGaussian repository
        uses: actions/checkout@v4
        with:
          repository: DekuLiuTesla/CityGaussian
          path: CityGaussian

      - name: Setup micromamba with Python 3.9
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          environment-name: gspl
          create-args: >-
            python=3.9
            pip
          init-shell: bash
          cache-environment: false
          post-cleanup: all

      - name: Upgrade pip tools
        shell: bash -el {0}
        run: |
          micromamba activate gspl
          python -m pip install --upgrade pip setuptools wheel

      - name: Install PyTorch CUDA 12.4
        shell: bash -el {0}
        run: |
          micromamba activate gspl

          pip install \
            --index-url https://download.pytorch.org/whl/cu124 \
            torch==2.5.1 \
            torchvision==0.20.* \
            torchaudio==2.5.*

      - name: Install torch_scatter
        shell: bash -el {0}
        run: |
          micromamba activate gspl

          pip install torch_scatter \
            -f https://data.pyg.org/whl/torch-2.5.1+cu124.html

      - name: Install project Python packages
        shell: bash -el {0}
        run: |
          micromamba activate gspl

          cat > /tmp/citygaussian_requirements.txt << 'EOF'
          open3d==0.18.0
          scikit-image==0.24.0
          trimesh==4.4.3
          imageio==2.36.0
          imageio-ffmpeg==0.5.1
          py3nvml
          splines==0.3.0
          plyfile==0.8.1
          tensorboard
          wandb
          tqdm
          einops
          joblib
          viser==0.2.3
          opencv-python-headless==4.10.*
          matplotlib
          mediapy==1.2.2
          lightning[pytorch-extra]==2.3.*
          pytorch-lightning==2.3.*
          bitsandbytes==0.45.*
          EOF

          pip install -r /tmp/citygaussian_requirements.txt

      - name: Show installed environment info
        shell: bash -el {0}
        run: |
          micromamba activate gspl

          echo "Python version:"
          python --version

          echo "Pip version:"
          pip --version

          echo "PyTorch info:"
          python - << 'EOF'
          import torch
          print("torch:", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          print("torch cuda:", torch.version.cuda)
          EOF

          echo "Installed packages:"
          pip list

      - name: Package environment
        shell: bash -el {0}
        run: |
          ENV_DIR="${MAMBA_ROOT_PREFIX}/envs/gspl"

          tar -czf gspl-ubuntu2404-python39-cu124.tar.gz -C "${ENV_DIR}" .

          ls -lh gspl-ubuntu2404-python39-cu124.tar.gz

      - name: Upload environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: gspl-ubuntu2404-python39-cu124
          path: gspl-ubuntu2404-python39-cu124.tar.gz
          retention-days: 7

      - name: Add download link to summary
        shell: bash
        run: |
          echo "## CityGaussian Environment Download" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "环境已经构建完成，并打包为 GitHub Actions Artifact。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "系统环境：" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ubuntu 24.04" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python 3.9" >> "$GITHUB_STEP_SUMMARY"
          echo "- PyTorch 2.5.1 CUDA 12.4" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "下载入口：" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact 名称：" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`gspl-ubuntu2404-python39-cu124\`" >> "$GITHUB_STEP_SUMMARY"
