name: Pack Audio Processing Conda Environment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment.yml and requirements.txt
        shell: bash
        run: |
          cat > environment.yml <<'EOF'
          name: audio-processing
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=3.11
            - pip
            # 安装实际的 ffmpeg 可执行程序；ffmpeg-python 只是 Python 调用封装。
            - ffmpeg
          EOF

          cat > requirements.txt <<'EOF'
          numpy
          scipy
          librosa
          soundfile
          pretty_midi
          music21
          mido
          tqdm
          ffmpeg-python
          basic-pitch
          EOF

          echo "Generated environment.yml:"
          cat environment.yml

          echo "Generated requirements.txt:"
          cat requirements.txt

      - name: Setup Miniconda and create audio-processing environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: false
          activate-environment: audio-processing
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install pip requirements
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "CONDA=$CONDA"

          conda run -n audio-processing python -m pip install --upgrade pip setuptools wheel

          echo "Install requirements.txt:"
          conda run -n audio-processing python -m pip install -r requirements.txt

          echo "Disk after pip requirements:"
          df -h

      - name: Show conda information
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "CONDA=$CONDA"
          conda info
          conda env list

          echo "Disk after environment creation:"
          df -h

          echo "audio-processing env size:"
          du -sh "$CONDA/envs/audio-processing"

      - name: Install conda-pack into base with pip
        shell: bash
        run: |
          set -exo pipefail

          echo "CONDA=$CONDA"

          "$CONDA/bin/python" -m pip install "conda-pack==0.9.1"
          "$CONDA/bin/python" -c "import conda_pack; print('conda_pack version:', conda_pack.__version__)"
          "$CONDA/bin/conda-pack" --version

      - name: Clean caches before packing
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Disk before clean:"
          df -h

          conda clean -a -y
          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.nv || true

          echo "Do NOT remove $CONDA/pkgs before conda-pack."
          echo "Do NOT delete files inside $CONDA/envs/audio-processing."

          echo "audio-processing env size:"
          du -sh "$CONDA/envs/audio-processing"

          echo "Disk after clean:"
          df -h

      - name: Pack and split audio-processing environment
        shell: bash
        run: |
          set -exo pipefail

          echo "Disk before pack:"
          df -h

          rm -rf release_parts
          mkdir -p release_parts
          rm -f audio-processing.tar.gz

          "$CONDA/bin/conda" run -n audio-processing python -V
          "$CONDA/bin/conda-pack" --version

          "$CONDA/bin/conda-pack" \
            -n audio-processing \
            -o audio-processing.tar.gz \
            --format tar.gz \
            --ignore-missing-files \
            --force

          ls -lh audio-processing.tar.gz
          df -h

          rm -rf "$CONDA/envs/audio-processing" || true
          rm -rf "$CONDA/pkgs" || true
          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.nv || true
          rm -rf /tmp/* || true

          echo "Disk after deleting env and caches:"
          df -h

          split -b 1000M -d -a 3 audio-processing.tar.gz release_parts/audio-processing.tar.gz.part-
          rm -f audio-processing.tar.gz

          cd release_parts
          ls -lh

          echo "Disk after split:"
          df -h

      - name: Create GitHub Release and upload parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-processing-conda-${{ github.run_number }}
          name: Audio Processing Conda Environment ${{ github.run_number }}
          body: |
            Audio processing Conda environment package.

            Environment name:

            ```text
            audio-processing
            ```

            Python version:

            ```text
            Python 3.12
            ```

            Main packages:

            ```text
            numpy
            scipy
            librosa
            soundfile
            pretty_midi
            music21
            mido
            tqdm
            ffmpeg
            ffmpeg-python
            basic-pitch
            ```

            Download all parts, then merge:

            ```bash
            cat audio-processing.tar.gz.part-* > audio-processing.tar.gz
            ```

            Extract:

            ```bash
            mkdir -p audio-processing
            tar -xzf audio-processing.tar.gz -C audio-processing
            ```

            Activate:

            ```bash
            source audio-processing/bin/activate
            ```

            First use after extracting:

            ```bash
            conda-unpack
            ```
          files: |
            release_parts/audio-processing.tar.gz.part-*
          fail_on_unmatched_files: true
