name: Pack Audio Processing Windows Conda Environment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment.yml and requirements.txt
        shell: pwsh
        run: |
          @"
          name: audio-processing
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=3.11
            - pip
            # ffmpeg-python 只是 Python 封装；此处安装实际 ffmpeg.exe。
            - ffmpeg
          "@ | Set-Content -Path environment.yml -Encoding utf8

          @"
          # basic-pitch 0.4.0 支持 Python 3.11；固定版本以避免 pip 回溯到旧版。
          numpy==1.26.4
          scipy==1.11.4
          librosa==0.10.2.post1
          soundfile==0.12.1
          pretty_midi==0.2.11
          music21==9.3.0
          mido==1.3.3
          tqdm==4.67.1
          ffmpeg-python==0.2.0
          basic-pitch==0.4.0
          "@ | Set-Content -Path requirements.txt -Encoding utf8

      - name: Setup Miniconda and create audio-processing environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: false
          activate-environment: audio-processing
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install pip requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          conda run -n audio-processing python -m pip install --upgrade pip setuptools wheel
          conda run -n audio-processing python -m pip install --prefer-binary -r requirements.txt

      - name: Install conda-pack into base environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $base = conda info --base
          & "$base\python.exe" -m pip install "conda-pack==0.9.1"

      - name: Pack Windows environment and split archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $base = conda info --base
          $condaPack = "$base\Scripts\conda-pack.exe"

          Remove-Item -Force audio-processing-windows.zip -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force release_parts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path release_parts | Out-Null

          & $condaPack `
            -n audio-processing `
            -o audio-processing-windows.zip `
            --format zip `
            --ignore-missing-files `
            --force

          # GitHub Release 单个文件最大 2GB，这里按 1000MB 分片。
          $sourceFile = "audio-processing-windows.zip"
          $outputDir = "release_parts"
          $partSize = 1000MB
          $bufferSize = 4MB
          $buffer = New-Object byte[] $bufferSize

          $inputStream = [System.IO.File]::OpenRead($sourceFile)
          $partIndex = 0

          try {
            while ($inputStream.Position -lt $inputStream.Length) {
              $partName = "audio-processing-windows.zip.part-{0:D3}" -f $partIndex
              $partPath = Join-Path $outputDir $partName

              $outputStream = [System.IO.File]::Create($partPath)
              $remaining = $partSize

              try {
                while ($remaining -gt 0 -and $inputStream.Position -lt $inputStream.Length) {
                  $toRead = [Math]::Min($buffer.Length, $remaining)
                  $read = $inputStream.Read($buffer, 0, $toRead)

                  if ($read -le 0) {
                    break
                  }

                  $outputStream.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              }
              finally {
                $outputStream.Dispose()
              }

              $partIndex++
            }
          }
          finally {
            $inputStream.Dispose()
          }

          Remove-Item -Force audio-processing-windows.zip

          Copy-Item environment.yml release_parts\environment.yml
          Copy-Item requirements.txt release_parts\requirements.txt

          Get-ChildItem release_parts | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-processing-windows-conda-${{ github.run_number }}
          name: Audio Processing Windows Conda Environment ${{ github.run_number }}
          body: |
            Prebuilt Windows x64 Conda environment for audio processing.

            Environment name:

            ```text
            audio-processing
            ```

            Python version:

            ```text
            Python 3.11
            ```

            Main packages:

            ```text
            numpy==1.26.4
            scipy==1.11.4
            librosa==0.10.2.post1
            soundfile==0.12.1
            pretty_midi==0.2.11
            music21==9.3.0
            mido==1.3.3
            tqdm==4.67.1
            ffmpeg
            ffmpeg-python==0.2.0
            basic-pitch==0.4.0
            ```

            ## Restore into Anaconda / Miniconda

            Download all part files:

            ```text
            audio-processing-windows.zip.part-000
            audio-processing-windows.zip.part-001
            audio-processing-windows.zip.part-002
            ...
            ```

            Put all part files in the same directory, then merge them in PowerShell:

            ```powershell
            $output = "audio-processing-windows.zip"
            Remove-Item -Force $output -ErrorAction SilentlyContinue

            Get-ChildItem "audio-processing-windows.zip.part-*" |
              Sort-Object Name |
              ForEach-Object {
                $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
                [System.IO.File]::Open($output, [System.IO.FileMode]::Append).Write($bytes, 0, $bytes.Length)
              }
            ```

            Extract the merged `audio-processing-windows.zip` directly to the `envs` directory of your Anaconda or Miniconda installation.

            Example for Anaconda:

            ```powershell
            Expand-Archive `
              -Path .\audio-processing-windows.zip `
              -DestinationPath "$env:USERPROFILE\anaconda3\envs\audio-processing"
            ```

            Example for Miniconda:

            ```powershell
            Expand-Archive `
              -Path .\audio-processing-windows.zip `
              -DestinationPath "$env:USERPROFILE\miniconda3\envs\audio-processing"
            ```

            Open a new **Anaconda Prompt** or PowerShell, then run once:

            ```powershell
            conda activate audio-processing
            conda-unpack
            ```

            Afterwards the environment can be used normally:

            ```powershell
            conda activate audio-processing
            ```

            `environment.yml` and `requirements.txt` are included for reference or manual rebuilding.
          files: |
            release_parts/audio-processing-windows.zip.part-*
            release_parts/environment.yml
            release_parts/requirements.txt
          fail_on_unmatched_files: true
