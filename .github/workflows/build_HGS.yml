name: Pack HorizonGS Conda Environment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create environment.yml
        shell: bash
        run: |
          cat > environment.yml <<'EOF'
          name: HorizonGS

          channels:
            - conda-forge
            - pytorch
            - nvidia
            - pyg
            - defaults

          dependencies:
            - python=3.8.19
            - pip
            - setuptools
            - wheel

            # build tools
            - ninja
            - cmake
            - make
            - gcc_linux-64
            - gxx_linux-64

            # common scientific packages
            - numpy
            - scipy
            - tqdm
            - pillow
            - matplotlib
            - opencv
            - plyfile
            - pyyaml

            # pytorch cuda
            - pytorch
            - torchvision
            - torchaudio
            - pytorch-cuda=11.8

            # PyG
            - pyg

            - pip:
                - submodules/diff-gaussian-rasterization
                - submodules/simple-knn
          EOF

          echo "Generated environment.yml:"
          cat environment.yml

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/node || true
          sudo rm -rf /opt/hostedtoolcache/Python || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true

          docker system prune -af || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          echo "Disk after cleanup:"
          df -h

      - name: Setup Miniconda and create HorizonGS environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: false
          activate-environment: HorizonGS
          environment-file: environment.yml
          auto-activate-base: false

      - name: Show conda information
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "CONDA=$CONDA"

          conda info
          conda env list

          echo "Disk after environment creation:"
          df -h

          echo "HorizonGS env size:"
          du -sh "$CONDA/envs/HorizonGS"

      - name: Check HorizonGS environment
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Check Python version inside HorizonGS:"
          conda run -n HorizonGS python -V

          echo "Check Python executable:"
          conda run -n HorizonGS python - <<'PY'
          import sys
          print("sys.executable:", sys.executable)
          print("sys.version:", sys.version)
          PY

          echo "Check pip:"
          conda run -n HorizonGS python -m pip --version

          echo "Check PyTorch:"
          conda run -n HorizonGS python - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("torch cuda:", torch.version.cuda)
          print("cuda available:", torch.cuda.is_available())
          print("cuda device count:", torch.cuda.device_count())
          PY

          echo "Check nvcc if installed:"
          conda run -n HorizonGS which nvcc || true
          conda run -n HorizonGS nvcc -V || true

      - name: Install conda-pack into base
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Install conda-pack into base:"
          conda install -n base -c conda-forge conda-pack -y

          echo "Check conda-pack module:"
          "$CONDA/bin/python" -c "import conda_pack; print('conda_pack version:', conda_pack.__version__)"

          echo "Check conda-pack executable:"
          ls -lh "$CONDA/bin/conda-pack"
          "$CONDA/bin/conda-pack" --version

      - name: Clean conda and pip caches before packing
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Disk before clean:"
          df -h

          echo "Clean conda caches:"
          conda clean -a -y

          echo "Remove user caches:"
          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.nv || true

          echo "Remove conda package cache manually:"
          rm -rf "$CONDA/pkgs"/* || true

          echo "Remove pycache files:"
          find "$CONDA/envs/HorizonGS" -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find "$CONDA/envs/HorizonGS" -type f -name "*.pyc" -delete || true
          find "$CONDA/envs/HorizonGS" -type f -name "*.pyo" -delete || true

          echo "Remove static libraries:"
          find "$CONDA/envs/HorizonGS" -type f -name "*.a" -delete || true

          echo "HorizonGS env size after clean:"
          du -sh "$CONDA/envs/HorizonGS"

          echo "Disk after clean:"
          df -h

      - name: Pack HorizonGS environment with conda-pack
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Disk before pack:"
          df -h

          echo "Confirm HorizonGS Python:"
          conda run -n HorizonGS python -V

          echo "Using conda-pack:"
          "$CONDA/bin/conda-pack" --version

          echo "Packing HorizonGS environment..."
          "$CONDA/bin/conda-pack" -n HorizonGS -o HorizonGS.tar.gz

          echo "Packed file:"
          ls -lh HorizonGS.tar.gz
          du -h HorizonGS.tar.gz

          echo "Disk after pack:"
          df -h

      - name: Split package into release parts and remove original tar
        shell: bash
        run: |
          set -euxo pipefail

          echo "Disk before split:"
          df -h

          mkdir -p release_parts

          echo "Split HorizonGS.tar.gz into <= 1900MB parts:"
          split -b 1900M -d -a 3 HorizonGS.tar.gz release_parts/HorizonGS.tar.gz.part-

          echo "Remove original HorizonGS.tar.gz to save disk:"
          rm -f HorizonGS.tar.gz

          cd release_parts

          echo "Generated parts:"
          ls -lh

          echo "Generate SHA256SUMS:"
          sha256sum HorizonGS.tar.gz.part-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "Disk after split:"
          df -h

      - name: Create GitHub Release and upload parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: HorizonGS-conda-${{ github.run_number }}
          name: HorizonGS Conda Environment ${{ github.run_number }}
          body: |
            HorizonGS Conda environment package.

            Python version:

            ```text
            Python 3.8.19
            ```

            Download all parts, then merge:

            ```bash
            cat HorizonGS.tar.gz.part-* > HorizonGS.tar.gz
            ```

            Extract:

            ```bash
            mkdir -p HorizonGS
            tar -xzf HorizonGS.tar.gz -C HorizonGS
            ```

            Activate:

            ```bash
            source HorizonGS/bin/activate
            ```

            First use after extracting:

            ```bash
            conda-unpack
            ```

            Check:

            ```bash
            python -V
            ```

            It should print:

            ```text
            Python 3.8.19
            ```

            SHA256 checksums are included in `SHA256SUMS.txt`.
          files: |
            release_parts/HorizonGS.tar.gz.part-*
            release_parts/SHA256SUMS.txt
          fail_on_unmatched_files: true
