name: Pack horizon_gs Conda Environment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment.yml
        shell: bash
        run: |
          cat > environment.yml <<'EOF'
          name: horizon_gs
          channels:
            - pytorch
            - pyg
            - conda-forge
            - defaults
          dependencies:
            - cudatoolkit=11.8
            - python=3.8.19
            - pip=24.2
            - pytorch=2.1.2
            - torchaudio=2.1.2
            - torchvision=0.16.2
            - pytorch-scatter
            - pip:
              - plyfile
              - tensorboard
              - tqdm
              - einops
              - wandb
              - lpips
              - laspy
              - jaxtyping
              - colorama
              - opencv-python
              - scikit-learn
          EOF

          echo "Generated environment.yml:"
          cat environment.yml

      - name: Setup Miniconda and create horizon_gs environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: false
          activate-environment: horizon_gs
          environment-file: environment.yml
          auto-activate-base: false

      - name: Show conda information
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "CONDA=$CONDA"
          conda info
          conda env list

          echo "Disk after environment creation:"
          df -h

          echo "horizon_gs env size:"
          du -sh "$CONDA/envs/horizon_gs"

      - name: Check horizon_gs environment
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Check Python version:"
          conda run -n horizon_gs python -V

          echo "Check Python executable:"
          conda run -n horizon_gs python - <<'PY'
          import sys
          print("sys.executable:", sys.executable)
          print("sys.version:", sys.version)
          PY

          echo "Check pip:"
          conda run -n horizon_gs python -m pip --version

          echo "Check PyTorch:"
          conda run -n horizon_gs python - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("torch cuda:", torch.version.cuda)
          print("cuda available:", torch.cuda.is_available())
          print("cuda device count:", torch.cuda.device_count())
          PY

          echo "Check pytorch_scatter:"
          conda run -n horizon_gs python - <<'PY'
          try:
              import torch_scatter
              print("torch_scatter:", torch_scatter.__version__)
          except Exception as e:
              print("torch_scatter import failed:", repr(e))
              raise
          PY

          echo "Check important pip packages:"
          conda run -n horizon_gs python - <<'PY'
          import plyfile
          import tensorboard
          import tqdm
          import einops
          import wandb
          import lpips
          import laspy
          import jaxtyping
          import colorama
          import cv2
          import sklearn

          print("all important packages imported successfully")
          print("cv2:", cv2.__version__)
          print("sklearn:", sklearn.__version__)
          PY

      - name: Install conda-pack into base
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Install conda-pack into base:"
          conda install -n base -c conda-forge conda-pack -y

          echo "Check conda-pack module:"
          "$CONDA/bin/python" -c "import conda_pack; print('conda_pack version:', conda_pack.__version__)"

          echo "Check conda-pack executable:"
          ls -lh "$CONDA/bin/conda-pack"
          "$CONDA/bin/conda-pack" --version

      - name: Clean conda and pip caches before packing
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Disk before clean:"
          df -h

          echo "Clean conda caches:"
          conda clean -a -y

          echo "Remove user caches:"
          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.nv || true

          echo "Remove conda package cache manually:"
          rm -rf "$CONDA/pkgs"/* || true

          echo "Remove pycache files:"
          find "$CONDA/envs/horizon_gs" -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find "$CONDA/envs/horizon_gs" -type f -name "*.pyc" -delete || true
          find "$CONDA/envs/horizon_gs" -type f -name "*.pyo" -delete || true

          echo "Remove static libraries:"
          find "$CONDA/envs/horizon_gs" -type f -name "*.a" -delete || true

          echo "horizon_gs env size after clean:"
          du -sh "$CONDA/envs/horizon_gs"

          echo "Disk after clean:"
          df -h

      - name: Pack horizon_gs environment with conda-pack
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Disk before pack:"
          df -h

          echo "Confirm horizon_gs Python:"
          conda run -n horizon_gs python -V

          echo "Using conda-pack:"
          "$CONDA/bin/conda-pack" --version

          echo "Packing horizon_gs environment..."
          "$CONDA/bin/conda-pack" -n horizon_gs -o horizon_gs.tar.gz

          echo "Packed file:"
          ls -lh horizon_gs.tar.gz
          du -h horizon_gs.tar.gz

          echo "Disk after pack:"
          df -h

      - name: Split package into release parts and remove original tar
        shell: bash
        run: |
          set -euxo pipefail

          echo "Disk before split:"
          df -h

          mkdir -p release_parts

          echo "Split horizon_gs.tar.gz into <= 1900MB parts:"
          split -b 1900M -d -a 3 horizon_gs.tar.gz release_parts/horizon_gs.tar.gz.part-

          echo "Remove original horizon_gs.tar.gz to save disk:"
          rm -f horizon_gs.tar.gz

          cd release_parts

          echo "Generated parts:"
          ls -lh

          echo "Generate SHA256SUMS:"
          sha256sum horizon_gs.tar.gz.part-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "Disk after split:"
          df -h

      - name: Create GitHub Release and upload parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: horizon-gs-conda-${{ github.run_number }}
          name: horizon_gs Conda Environment ${{ github.run_number }}
          body: |
            horizon_gs Conda environment package.

            Environment name:

            ```text
            horizon_gs
            ```

            Python version:

            ```text
            Python 3.8.19
            ```

            Main packages:

            ```text
            cudatoolkit=11.8
            pytorch=2.1.2
            torchvision=0.16.2
            torchaudio=2.1.2
            pytorch-scatter
            ```

            Download all parts, then merge:

            ```bash
            cat horizon_gs.tar.gz.part-* > horizon_gs.tar.gz
            ```

            Extract:

            ```bash
            mkdir -p horizon_gs
            tar -xzf horizon_gs.tar.gz -C horizon_gs
            ```

            Activate:

            ```bash
            source horizon_gs/bin/activate
            ```

            First use after extracting:

            ```bash
            conda-unpack
            ```

            Check:

            ```bash
            python -V
            python -c "import torch; print(torch.__version__, torch.version.cuda)"
            ```

            SHA256 checksums are included in `SHA256SUMS.txt`.
          files: |
            release_parts/horizon_gs.tar.gz.part-*
            release_parts/SHA256SUMS.txt
          fail_on_unmatched_files: true
