name: Pack Horizon-GS Conda Environment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment.yml and requirements.txt
        shell: bash
        run: |
          cat > environment.yml <<'EOF'
          name: horizon_gs
          channels:
            - pytorch
            - pyg
            - conda-forge
            - defaults
          dependencies:
            - python=3.8.19
            - pip=24.2
            - ninja
            - cudatoolkit=11.8
          EOF

          cat > requirements.txt <<'EOF'
          # Torch-related packages are installed separately from CUDA 11.8 wheels:
          # torch, torchvision, torchaudio, torch-scatter

          plyfile
          tensorboard
          tqdm
          einops
          wandb
          lpips
          laspy
          jaxtyping
          colorama
          opencv-python
          scikit-learn
          EOF

          echo "===== environment.yml ====="
          cat environment.yml

          echo "===== requirements.txt ====="
          cat requirements.txt

      - name: Setup Miniconda and create horizon_gs environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: false
          activate-environment: horizon_gs
          environment-file: environment.yml
          auto-activate-base: false

      - name: Upgrade pip build tools
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          conda run -n horizon_gs python -V
          conda run -n horizon_gs python -m pip --version

          conda run -n horizon_gs python -m pip install \
            --upgrade \
            pip==24.2 \
            setuptools \
            wheel

      - name: Install PyTorch CUDA 11.8 packages
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          PYTORCH_CU118_INDEX="https://download.pytorch.org/whl/cu118"

          echo "===== Install PyTorch CUDA 11.8 wheels ====="

          conda run -n horizon_gs python -m pip install \
            torch==2.1.2 \
            torchvision==0.16.2 \
            torchaudio==2.1.2 \
            --index-url "$PYTORCH_CU118_INDEX"

          echo "===== Verify PyTorch CUDA 11.8 ====="

          conda run -n horizon_gs python - <<'PY'
          import torch
          import torchvision
          import torchaudio

          print("torch:", torch.__version__)
          print("torch CUDA:", torch.version.cuda)
          print("torchvision:", torchvision.__version__)
          print("torchaudio:", torchaudio.__version__)
          print("CUDA available on GitHub Actions runner:", torch.cuda.is_available())
          print("CUDA device count:", torch.cuda.device_count())

          assert torch.__version__.startswith("2.1.2"), torch.__version__
          assert torchvision.__version__.startswith("0.16.2"), torchvision.__version__
          assert torchaudio.__version__.startswith("2.1.2"), torchaudio.__version__
          assert torch.version.cuda == "11.8", (
              f"Expected CUDA 11.8 PyTorch wheel, got CUDA {torch.version.cuda}"
          )
          PY

      - name: Install torch-scatter from PyG CUDA 11.8 wheels
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          # PyG uses the torch 2.1.0 page for PyTorch 2.1.x compatible wheels.
          PYG_CU118_WHEEL_URL="https://data.pyg.org/whl/torch-2.1.0+cu118.html"

          echo "===== Install torch-scatter from PyG cu118 wheel page ====="

          conda run -n horizon_gs python -m pip install \
            --no-cache-dir \
            torch-scatter \
            -f "$PYG_CU118_WHEEL_URL"

          echo "===== Verify torch-scatter ====="

          conda run -n horizon_gs python - <<'PY'
          import torch
          import torch_scatter

          print("torch:", torch.__version__)
          print("torch CUDA:", torch.version.cuda)
          print("torch_scatter:", torch_scatter.__version__)
          print("torch-scatter imported successfully")
          PY

      - name: Install remaining Horizon-GS dependencies
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          conda run -n horizon_gs python -m pip install \
            --prefer-binary \
            -r requirements.txt

          echo "===== Installed torch-related packages ====="
          conda run -n horizon_gs python -m pip list | grep -Ei \
            'torch|scatter|cuda|nvidia' || true

          echo "===== Disk usage after installation ====="
          df -h

      - name: Check horizon_gs environment
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "===== Python ====="
          conda run -n horizon_gs python -V

          echo "===== PyTorch CUDA 11.8 ====="
          conda run -n horizon_gs python - <<'PY'
          import torch
          import torchvision
          import torchaudio
          import torch_scatter

          print("torch:", torch.__version__)
          print("torch CUDA:", torch.version.cuda)
          print("torchvision:", torchvision.__version__)
          print("torchaudio:", torchaudio.__version__)
          print("torch_scatter:", torch_scatter.__version__)
          print("CUDA available:", torch.cuda.is_available())

          assert torch.version.cuda == "11.8"
          PY

          echo "===== Normal Python packages ====="
          conda run -n horizon_gs python - <<'PY'
          import colorama
          import einops
          import jaxtyping
          import laspy
          import lpips
          import cv2
          import plyfile
          import sklearn
          import tensorboard
          import tqdm
          import wandb

          print("opencv:", cv2.__version__)
          print("laspy:", laspy.__version__)
          print("scikit-learn:", sklearn.__version__)
          print("wandb:", wandb.__version__)
          print("All normal packages imported successfully.")
          PY

      - name: Show Conda information
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          conda info
          conda env list
          conda list -n horizon_gs

          echo "===== horizon_gs environment size ====="
          du -sh "$CONDA/envs/horizon_gs"

          echo "===== Disk usage ====="
          df -h

      - name: Install conda-pack into base environment
        shell: bash
        run: |
          set -euxo pipefail

          "$CONDA/bin/python" -m pip install --upgrade pip
          "$CONDA/bin/python" -m pip install "conda-pack==0.9.1"

          "$CONDA/bin/conda-pack" --version

      - name: Clean caches before packing
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "===== Disk before cleanup ====="
          df -h

          conda clean -a -y

          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.nv || true

          echo "===== horizon_gs environment size ====="
          du -sh "$CONDA/envs/horizon_gs"

          echo "===== Disk after cleanup ====="
          df -h

      - name: Pack and split horizon_gs environment
        shell: bash
        run: |
          set -euxo pipefail

          ENV_NAME="horizon_gs"
          ARCHIVE_NAME="horizon_gs.tar.gz"
          RELEASE_DIR="release_parts"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          rm -f "$ARCHIVE_NAME"

          echo "===== Confirm environment ====="
          "$CONDA/bin/conda" run -n "$ENV_NAME" python -V
          "$CONDA/bin/conda" run -n "$ENV_NAME" python -c \
            "import torch; print('torch:', torch.__version__, 'CUDA:', torch.version.cuda)"

          echo "===== Pack Conda environment ====="
          "$CONDA/bin/conda-pack" \
            -n "$ENV_NAME" \
            -o "$ARCHIVE_NAME" \
            --format tar.gz \
            --ignore-missing-files \
            --force

          echo "===== Packed archive ====="
          ls -lh "$ARCHIVE_NAME"

          echo "===== Delete environment and cache before splitting ====="
          rm -rf "$CONDA/envs/$ENV_NAME" || true
          rm -rf "$CONDA/pkgs" || true
          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.nv || true
          rm -rf /tmp/* || true

          echo "===== Disk before splitting ====="
          df -h

          # Each GitHub Release asset is 1000MB.
          split \
            -b 1000M \
            -d \
            -a 3 \
            "$ARCHIVE_NAME" \
            "$RELEASE_DIR/horizon_gs.tar.gz.part-"

          rm -f "$ARCHIVE_NAME"

          cp environment.yml "$RELEASE_DIR/environment.yml"
          cp requirements.txt "$RELEASE_DIR/requirements.txt"

          echo "===== Generated release files ====="
          ls -lh "$RELEASE_DIR"

          echo "===== Disk after splitting ====="
          df -h

      - name: Create GitHub Release and upload parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: horizon-gs-cu118-conda-${{ github.run_number }}
          name: Horizon-GS CUDA 11.8 Conda Environment ${{ github.run_number }}
          body: |
            Prebuilt Linux x64 Conda environment for Horizon-GS.

            ## Environment

            ```text
            Name: horizon_gs
            Python: 3.8.19
            CUDA: 11.8 (cu118)
            ```

            ## PyTorch CUDA packages

            ```text
            torch==2.1.2+cu118
            torchvision==0.16.2+cu118
            torchaudio==2.1.2+cu118
            torch-scatter (PyG cu118 wheel)
            ```

            PyTorch CUDA wheel source:

            ```text
            https://download.pytorch.org/whl/cu118
            ```

            torch-scatter CUDA wheel source:

            ```text
            https://data.pyg.org/whl/torch-2.1.0+cu118.html
            ```

            ## Other packages

            ```text
            plyfile
            tensorboard
            tqdm
            einops
            wandb
            lpips
            laspy
            jaxtyping
            colorama
            opencv-python
            scikit-learn
            ```

            ## Restore

            Download every file named like this into the same directory:

            ```text
            horizon_gs.tar.gz.part-000
            horizon_gs.tar.gz.part-001
            horizon_gs.tar.gz.part-002
            ...
            ```

            Merge all archive parts:

            ```bash
            cat horizon_gs.tar.gz.part-* > horizon_gs.tar.gz
            ```

            Extract:

            ```bash
            mkdir -p horizon_gs
            tar -xzf horizon_gs.tar.gz -C horizon_gs
            ```

            Activate:

            ```bash
            source horizon_gs/bin/activate
            ```

            Run once after extraction:

            ```bash
            conda-unpack
            ```

            Verify:

            ```bash
            python -V
            python -c "import torch; print(torch.__version__, torch.version.cuda)"
            python -c "import torchvision; print(torchvision.__version__)"
            python -c "import torchaudio; print(torchaudio.__version__)"
            python -c "import torch_scatter; print(torch_scatter.__version__)"
            ```

            `environment.yml` and `requirements.txt` are included for manual rebuilding.
          files: |
            release_parts/horizon_gs.tar.gz.part-*
            release_parts/environment.yml
            release_parts/requirements.txt
          fail_on_unmatched_files: true
