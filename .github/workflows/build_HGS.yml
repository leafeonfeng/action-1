name: Build HorizonGS Conda Env

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment.yml
        shell: bash
        run: |
          cat > environment.yml <<'EOF'
          name: HorizonGS

          channels:
            - pytorch
            - nvidia
            - pyg
            - conda-forge
            - defaults

          dependencies:
            - python=3.8.19
            - pip=24.2

            # PyTorch CUDA 11.8
            - pytorch=2.1.2
            - torchvision=0.16.2
            - torchaudio=2.1.2
            - pytorch-cuda=11.8

            # nvcc for compiling CUDA extensions
            - cuda-nvcc=11.8

            # PyG extension
            - pytorch-scatter

            # Build tools
            - cmake
            - ninja
            - setuptools
            - wheel

            - pip:
                - plyfile
                - tensorboard
                - tqdm
                - einops
                - wandb
                - lpips
                - laspy
                - jaxtyping
                - colorama
                - opencv-python
                - scikit-learn
          EOF

          echo "Generated environment.yml:"
          cat environment.yml

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: true
          activate-environment: HorizonGS
          environment-file: environment.yml

      - name: Install conda-pack
        shell: bash -el {0}
        run: |
          conda install -n base -c conda-forge conda-pack -y

      - name: Check HorizonGS environment
        shell: bash -el {0}
        run: |
          conda activate HorizonGS

          echo "CONDA_PREFIX=$CONDA_PREFIX"

          echo "Python:"
          python -V

          echo "Pip:"
          python -m pip --version

          echo "Conda packages:"
          conda list | head -n 50

          echo "PyTorch check:"
          python - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("torch cuda:", torch.version.cuda)
          print("cuda available:", torch.cuda.is_available())
          print("cuda device count:", torch.cuda.device_count())
          PY

          echo "nvcc check:"
          which nvcc || true
          nvcc -V || true

      - name: Pack HorizonGS environment with conda-pack
        shell: bash -el {0}
        run: |
          conda pack -n HorizonGS -o HorizonGS.tar.gz

          echo "Packed file:"
          ls -lh HorizonGS.tar.gz
          du -h HorizonGS.tar.gz

      - name: Split package into volumes <= 1.9GB
        shell: bash
        run: |
          mkdir -p release_parts

          # 1900M is safely below 1.9GiB/2GB release asset limits.
          split -b 1900M -d -a 3 HorizonGS.tar.gz release_parts/HorizonGS.tar.gz.part-

          cd release_parts

          echo "Generated split volumes:"
          ls -lh

          sha256sum HorizonGS.tar.gz.part-* > SHA256SUMS.txt

          echo "SHA256SUMS:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="HorizonGS-env-${GITHUB_RUN_NUMBER}"
          TITLE="HorizonGS Conda Env ${GITHUB_RUN_NUMBER}"

          echo "TAG=$TAG" >> "$GITHUB_ENV"

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "HorizonGS conda-pack environment for Python 3.8.19, PyTorch 2.1.2, CUDA 11.8. Split into volumes, each <= 1.9GB."

      - name: Upload split volumes to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" release_parts/* --clobber

      - name: Print download links
        shell: bash
        run: |
          {
            echo "## HorizonGS 环境下载链接"
            echo ""
            echo "Release 页面："
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo ""
            echo "### 分卷文件下载"
            echo ""

            for f in release_parts/*; do
              name=$(basename "$f")
              echo "- https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
            done

            echo ""
            echo "### 下载后合并"
            echo ""
            echo '```bash'
            echo "cat HorizonGS.tar.gz.part-* > HorizonGS.tar.gz"
            echo '```'
            echo ""
            echo "### 解包到 conda 环境目录"
            echo ""
            echo '```bash'
            echo "mkdir -p /root/miniconda3/envs/HorizonGS"
            echo "tar -xzf HorizonGS.tar.gz -C /root/miniconda3/envs/HorizonGS"
            echo "/root/miniconda3/envs/HorizonGS/bin/conda-unpack"
            echo '```'
            echo ""
            echo "### 激活环境"
            echo ""
            echo '```bash'
            echo "conda activate HorizonGS"
            echo '```'
            echo ""
            echo "### 测试环境"
            echo ""
            echo '```bash'
            echo "python -V"
            echo "python -m pip --version"
            echo "python -c \"import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())\""
            echo "nvcc -V"
            echo '```'
            echo ""
            echo "### 如果 nvcc 找不到"
            echo ""
            echo '```bash'
            echo "export CUDA_HOME=\$CONDA_PREFIX"
            echo "export PATH=\$CONDA_PREFIX/bin:\$PATH"
            echo "export LD_LIBRARY_PATH=\$CONDA_PREFIX/lib:\$LD_LIBRARY_PATH"
            echo "nvcc -V"
            echo '```'
            echo ""
            echo "### 校验 SHA256"
            echo ""
            echo "先进入分卷文件所在目录，然后执行："
            echo ""
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
