name: Pack DeSiReGS Conda Environment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment.yml and requirements.txt
        shell: bash
        run: |
          cat > environment.yml <<'EOF'
          name: DeSiReGS
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=3.10
            - pip=24.0
          EOF

          cat > requirements.txt <<'EOF'
          tqdm
          imageio
          imageio[ffmpeg]
          kornia
          trimesh
          Pillow
          ninja
          omegaconf
          plyfile
          opencv_python
          opencv_contrib_python
          tensorboardX
          matplotlib
          texttable
          albumentations
          timm==0.9.10
          scikit-learn
          torch-kmeans
          albucore
          open3d
          tensorboard
          gdown
          h5py
          pytorch_lightning
          EOF

          echo "Generated environment.yml:"
          cat environment.yml

          echo "Generated requirements.txt:"
          cat requirements.txt

      - name: Setup Miniconda and create DeSiReGS environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: false
          activate-environment: DeSiReGS
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install GPU PyTorch and pip requirements
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "CONDA=$CONDA"

          echo "Check Python and pip before pip install:"
          conda run -n DeSiReGS python -V
          conda run -n DeSiReGS python -m pip --version

          echo "Upgrade build tools:"
          conda run -n DeSiReGS python -m pip install --upgrade pip setuptools wheel

          echo "Install PyTorch GPU CUDA 11.8 wheels:"
          conda run -n DeSiReGS python -m pip install \
            torch==2.2.0 \
            torchvision==0.17.0 \
            --index-url https://download.pytorch.org/whl/cu118

          echo "Install requirements.txt:"
          conda run -n DeSiReGS python -m pip install -r requirements.txt

          echo "Disk after pip requirements:"
          df -h

      - name: Show conda information
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "CONDA=$CONDA"
          conda info
          conda env list

          echo "Disk after environment creation:"
          df -h

          echo "DeSiReGS env size:"
          du -sh "$CONDA/envs/DeSiReGS"

      - name: Check DeSiReGS environment
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Check Python version:"
          conda run -n DeSiReGS python -V

          echo "Check pip:"
          conda run -n DeSiReGS python -m pip --version

          echo "Check PyTorch GPU wheel:"
          conda run -n DeSiReGS python - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("torch cuda:", torch.version.cuda)
          print("cuda available:", torch.cuda.is_available())
          print("cuda device count:", torch.cuda.device_count())
          assert torch.version.cuda is not None, "PyTorch is not a CUDA/GPU build"
          PY

          echo "Check torchvision:"
          conda run -n DeSiReGS python - <<'PY'
          import torchvision
          print("torchvision:", torchvision.__version__)
          PY

          echo "Check important packages:"
          conda run -n DeSiReGS python - <<'PY'
          import tqdm
          import imageio
          import kornia
          import trimesh
          import PIL
          import ninja
          import omegaconf
          import plyfile
          import cv2
          import tensorboardX
          import matplotlib
          import texttable
          import albumentations
          import timm
          import sklearn
          import torch_kmeans
          import albucore
          import open3d as o3d
          import tensorboard
          import gdown
          import h5py
          import pytorch_lightning as pl

          print("timm:", timm.__version__)
          print("all important packages imported successfully")
          PY

      - name: Install conda-pack into base with pip
        shell: bash
        run: |
          set -exo pipefail

          echo "CONDA=$CONDA"

          echo "Install conda-pack into base by pip:"
          "$CONDA/bin/python" -m pip install "conda-pack==0.9.1"

          echo "Check conda-pack module:"
          "$CONDA/bin/python" -c "import conda_pack; print('conda_pack version:', conda_pack.__version__)"

          echo "Check conda-pack executable:"
          ls -lh "$CONDA/bin/conda-pack"
          "$CONDA/bin/conda-pack" --version

      - name: Clean caches before packing
        shell: bash -el {0}
        run: |
          set -euxo pipefail

          echo "Disk before clean:"
          df -h

          echo "Clean conda caches:"
          conda clean -a -y

          echo "Remove user caches only:"
          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.nv || true

          echo "Do NOT remove $CONDA/pkgs before conda-pack."
          echo "Do NOT delete files inside $CONDA/envs/DeSiReGS."

          echo "DeSiReGS env size:"
          du -sh "$CONDA/envs/DeSiReGS"

          echo "Disk after clean:"
          df -h

      - name: Pack and split DeSiReGS environment
        shell: bash
        run: |
          set -exo pipefail

          echo "Disk before pack:"
          df -h

          rm -rf release_parts
          mkdir -p release_parts

          rm -f DeSiReGS.tar.gz

          echo "Confirm DeSiReGS Python:"
          "$CONDA/bin/conda" run -n DeSiReGS python -V

          echo "Using conda-pack:"
          "$CONDA/bin/conda-pack" --version

          echo "Packing DeSiReGS environment to normal tar.gz file:"
          "$CONDA/bin/conda-pack" \
            -n DeSiReGS \
            -o DeSiReGS.tar.gz \
            --format tar.gz \
            --ignore-missing-files \
            --force

          echo "Packed file:"
          ls -lh DeSiReGS.tar.gz

          echo "Disk after pack before deleting env:"
          df -h

          echo "Delete packed conda environment to free disk before split:"
          rm -rf "$CONDA/envs/DeSiReGS" || true

          echo "Delete conda package cache after conda-pack:"
          rm -rf "$CONDA/pkgs" || true

          echo "Delete user caches:"
          rm -rf ~/.cache/pip || true
          rm -rf ~/.cache/torch || true
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/conda || true
          rm -rf ~/.nv || true
          rm -rf /tmp/* || true

          echo "Disk after deleting env and caches:"
          df -h

          echo "Split package:"
          split -b 1000M -d -a 3 DeSiReGS.tar.gz release_parts/DeSiReGS.tar.gz.part-

          echo "Remove full tar.gz to free disk:"
          rm -f DeSiReGS.tar.gz

          cd release_parts

          echo "Generated parts:"
          ls -lh

          echo "Disk after split:"
          df -h

      - name: Create GitHub Release and upload parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desiregs-conda-${{ github.run_number }}
          name: DeSiReGS Conda Environment ${{ github.run_number }}
          body: |
            DeSiReGS Conda environment package.

            Environment name:

            ```text
            DeSiReGS
            ```

            Python version:

            ```text
            Python 3.10
            ```

            Main packages:

            ```text
            torch==2.2.0
            torchvision==0.17.0
            CUDA wheel: cu118
            timm==0.9.10
            kornia
            open3d
            opencv_python
            opencv_contrib_python
            pytorch_lightning
            torch-kmeans
            tensorboard
            tensorboardX
            ```

            Download all parts, then merge:

            ```bash
            cat DeSiReGS.tar.gz.part-* > DeSiReGS.tar.gz
            ```

            Extract:

            ```bash
            mkdir -p DeSiReGS
            tar -xzf DeSiReGS.tar.gz -C DeSiReGS
            ```

            Activate:

            ```bash
            source DeSiReGS/bin/activate
            ```

            First use after extracting:

            ```bash
            conda-unpack
            ```

            Check:

            ```bash
            python -V
            python -c "import torch; print(torch.__version__, torch.version.cuda)"
            python -c "import torchvision; print(torchvision.__version__)"
            python -c "import timm; print(timm.__version__)"
            python -c "import open3d as o3d; print(o3d.__version__)"
            ```
          files: |
            release_parts/DeSiReGS.tar.gz.part-*
          fail_on_unmatched_files: true
